# ForgeSight: Postgres + MinIO (S3-compatible) + API + web UI.
#   cp .env.example .env   # set FS_SECRET_KEY and passwords
#   ./scripts/fetch_assets.sh && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgesight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: forgesight
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U forgesight"], interval: 5s, timeout: 3s, retries: 20 }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes: [objects:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 20 }

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { db: { condition: service_healthy }, minio: { condition: service_healthy } }
    environment:
      FS_ENV: production
      FS_DATABASE_URL: postgresql+psycopg://forgesight:${POSTGRES_PASSWORD}@db:5432/forgesight
      FS_SECRET_KEY: ${FS_SECRET_KEY:?set FS_SECRET_KEY in .env}
      FS_ADMIN_EMAIL: ${FS_ADMIN_EMAIL:-admin@forgesight.local}
      FS_ADMIN_PASSWORD: ${FS_ADMIN_PASSWORD:?set FS_ADMIN_PASSWORD in .env}
      FS_STORAGE_BACKEND: s3
      FS_S3_ENDPOINT_URL: http://minio:9000
      FS_S3_BUCKET: forgesight
      FS_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      FS_S3_SECRET_KEY: ${S3_SECRET_KEY}
      FS_CORS_ORIGINS: ${FS_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./data/models:/app/data/models        # model store (cards, weights, profiles, evaluations)
      - ./data/weights:/app/data/weights:ro   # pretrained backbone
    ports: ["8000:8000"]

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  objects:
